# ============================================
# Foggy Dataset Model - MySQL 8.0 测试环境配置
# 文件: application-mysql8.yml
# 使用方法: --spring.profiles.active=mysql8
# 启动数据库: docker compose -f foggy-dataset-demo/docker/docker-compose.yml up -d mysql8
# ============================================

spring:
  application:
    name: foggy-dataset-model-test

  datasource:
    url: jdbc:mysql://127.0.0.1:13308/foggy_test?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: foggy
    password: foggy_test_123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: FoggyTestHikariCP-MySQL8
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
        dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false

logging:
  level:
    root: INFO
    org.springframework.jdbc: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    com.foggyframework: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

foggy:
  dataset:
    show-sql: true
    sql-format: false
    sql-log-level: DEBUG
    show-sql-parameters: true
    show-execution-time: true
    templates-path: classpath:/foggy/templates/
    cache:
      enabled: true
      ttl: 3600
    query:
      max-rows: 10000
      timeout: 30000

test:
  database:
    type: mysql
    version: "8.0"
  data:
    generate-on-startup: false
    cleanup-after-test: false

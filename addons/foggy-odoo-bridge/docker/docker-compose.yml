version: '3.8'

services:
  # ──────────────────────────────────────────────
  # PostgreSQL — shared by Odoo and Foggy
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: foggy-odoo-postgres
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ──────────────────────────────────────────────
  # Odoo 17 — with foggy_mcp addon
  # ──────────────────────────────────────────────
  odoo:
    image: odoo:17.0
    container_name: foggy-odoo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: odoo
    volumes:
      # Mount foggy_mcp addon
      - ../foggy_mcp:/mnt/extra-addons/foggy_mcp:ro
      # Odoo config
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
    # 首次安装模块:
    #   docker compose run --rm odoo odoo -i sale,purchase,account,stock,hr,foggy_mcp -d odoo --stop-after-init
    # 后续正常启动:
    #   docker compose up -d odoo
    command: ["odoo", "--database=odoo"]

  # ──────────────────────────────────────────────
  # Foggy MCP Server (Java) — lite mode
  #
  # Two deployment options:
  #   1. Pre-built image:  docker compose up -d foggy-mcp
  #   2. Local JAR build:  docker compose --profile local up -d foggy-mcp-local
  # ──────────────────────────────────────────────
  foggy-mcp:
    image: foggysource/foggy-dataset-mcp:latest
    container_name: foggy-mcp-server
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: lite
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/odoo
      SPRING_DATASOURCE_USERNAME: odoo
      SPRING_DATASOURCE_PASSWORD: odoo
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      FOGGY_DEMO_ENABLED: "false"
      FOGGY_BUNDLE_EXTERNAL_ENABLED: "true"
      FOGGY_BUNDLE_EXTERNAL_BUNDLES_0_NAME: odoo-models
      FOGGY_BUNDLE_EXTERNAL_BUNDLES_0_PATH: /foggy-models
      FOGGY_BUNDLE_EXTERNAL_BUNDLES_0_NAMESPACE: odoo
      FOGGY_MCP_SEMANTIC_MODELLIST_0: OdooSaleOrderQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_1: OdooSaleOrderLineQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_2: OdooPurchaseOrderQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_3: OdooAccountMoveQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_4: OdooStockPickingQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_5: OdooHrEmployeeQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_6: OdooResPartnerQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_7: OdooResCompanyQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_8: OdooCrmLeadQueryModel
    volumes:
      - ../foggy-models:/foggy-models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────
  # Foggy MCP Server — local JAR (profile: local)
  #
  # Uses pre-built JAR from Maven. Build first:
  #   cd ../../.. && mvn package -pl foggy-mcp-launcher -am -DskipTests
  # Start:
  #   docker compose --profile local up -d foggy-mcp-local
  # ──────────────────────────────────────────────
  foggy-mcp-local:
    image: eclipse-temurin:17-jre
    container_name: foggy-mcp-server
    profiles: ["local"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: lite
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/odoo
      SPRING_DATASOURCE_USERNAME: odoo
      SPRING_DATASOURCE_PASSWORD: odoo
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      FOGGY_DEMO_ENABLED: "false"
      FOGGY_BUNDLE_EXTERNAL_ENABLED: "true"
      FOGGY_BUNDLE_EXTERNAL_BUNDLES_0_NAME: odoo-models
      FOGGY_BUNDLE_EXTERNAL_BUNDLES_0_PATH: /foggy-models
      FOGGY_BUNDLE_EXTERNAL_BUNDLES_0_NAMESPACE: odoo
      FOGGY_MCP_SEMANTIC_MODELLIST_0: OdooSaleOrderQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_1: OdooSaleOrderLineQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_2: OdooPurchaseOrderQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_3: OdooAccountMoveQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_4: OdooStockPickingQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_5: OdooHrEmployeeQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_6: OdooResPartnerQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_7: OdooResCompanyQueryModel
      FOGGY_MCP_SEMANTIC_MODELLIST_8: OdooCrmLeadQueryModel
    volumes:
      - ../foggy-models:/foggy-models:ro
      - ../../../foggy-mcp-launcher/target:/app:ro
    working_dir: /app
    entrypoint: ["sh", "-c", "java -jar /app/foggy-mcp-launcher-*.jar"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

# ═══════════════════════════════════════════════════════════════
# Foggy MCP Server — Odoo Integration Profile
#
# Usage:
#   java -jar foggy-mcp-launcher.jar --spring.config.additional-location=application-odoo.yml
#   or set: --spring.profiles.active=lite  (and this file via additional-location)
# ═══════════════════════════════════════════════════════════════

spring:
  profiles:
    active: lite

  datasource:
    url: jdbc:postgresql://localhost:5432/odoo
    username: odoo
    password: odoo
    driver-class-name: org.postgresql.Driver

logging:
  file:
    path: ./logs
  level:
    com.foggyframework.dataset.mcp.controller: DEBUG
    com.foggyframework.dataset.mcp.service.McpToolDispatcher: DEBUG
    com.foggyframework.dataset.mcp.tools: DEBUG
    com.foggyframework.dataset.mcp.spi.impl: DEBUG

foggy:
  demo:
    enabled: false

  bundle:
    external:
      enabled: true
      bundles:
        - name: odoo-models
          # Overridden by start-foggy-mcp.sh to absolute path
          path: ./foggy-models
          namespace: odoo

  mcp:
    semantic:
      model-list:
        - OdooSaleOrderQueryModel
        - OdooSaleOrderLineQueryModel
        - OdooPurchaseOrderQueryModel
        - OdooAccountMoveQueryModel
        - OdooStockPickingQueryModel
        - OdooHrEmployeeQueryModel
        - OdooResPartnerQueryModel
        - OdooResCompanyQueryModel

# Data Viewer 默认配置
foggy:
  data-viewer:
    enabled: true
    base-url: http://localhost:8080/data-viewer

    cache:
      ttl-minutes: 120
      cleanup-interval: 3000000

    thresholds:
      large-dataset-min: 500
      # MCP 查询结果自动截断阈值（单元格数量 = 行数 × 列数）
      # 当来自 MCP 的查询结果超过此阈值时，自动截断并返回链接
      # 默认值 10000，约 100 行 × 100 列
      cell-threshold-for-truncation: 10000
      # MCP 查询结果截断后保留的行数
      # 截断时保留前 N 行返回给 LLM 作为样本数据
      # 默认值 100 行
      truncated-row-limit: 100

    security:
      require-auth: false

    scope-constraints:
      enabled: true
      default-max-duration-days: 31
      models: {}

# 静态资源配置
spring:
  web:
    resources:
      static-locations:
        - classpath:/static/

# ============================================================

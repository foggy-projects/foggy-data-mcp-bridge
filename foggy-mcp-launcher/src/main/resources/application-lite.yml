# ============================================================
# 极简模式（Lite Profile）
# 无需 MongoDB，仅保留核心 MCP + JDBC 查询能力
#
# 启动方式：
#   java -jar foggy-mcp-launcher.jar --spring.profiles.active=lite
#   或 SPRING_PROFILES_ACTIVE=lite
#
# 数据源：使用内存 SQLite 作为启动数据源
# 实际业务数据源通过 DataSource API 动态配置
# ============================================================

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

  datasource:
    url: "jdbc:sqlite:file:foggy_mcp_lite?mode=memory&cache=shared"
    driver-class-name: org.sqlite.JDBC
    hikari:
      pool-name: FoggyMcpLiteSQLiteHikariCP
      minimum-idle: 1
      maximum-pool-size: 1
      idle-timeout: 0
      max-lifetime: 0
      connection-test-query: SELECT 1

  sql:
    init:
      mode: always
      schema-locations: classpath:/db/lite-demo-schema.sql
      data-locations: classpath:/db/lite-demo-data.sql

foggy:
  # 关闭 Data Viewer（强依赖 MongoDB）
  data-viewer:
    enabled: false

  mcp:
    semantic:
      model-list:
        - FactOrderQueryModel

    # 关闭审计日志（需要 MongoDB）
    audit:
      enabled: false

    # 禁用依赖 Data Viewer 的 MCP 工具
    tools:
      - name: "dataset.open_in_viewer"
        enabled: false

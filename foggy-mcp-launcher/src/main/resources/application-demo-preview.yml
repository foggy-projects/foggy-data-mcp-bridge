server:
  port: 18172
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

foggy:
  runtime-api:
    enabled: true # Load the demo bundle registry into the Java model engine for Viewer re-queries.
  auth:
    mode: disabled # This profile is loopback-only; MCP service grants control DataViewer access.
  mcp:
    audit:
      enabled: false
  dataset:
    request:
      default-namespace: harness_demo_logistics
  data-viewer:
    enabled: true
    base-url: http://127.0.0.1:${server.port}/data-viewer
    link-authorization:
      enabled: true
      link-ttl: 0s # Permanent and reusable until revoked or service authorization changes.
      session-ttl: 24h # Absolute lifetime from issuance; no idle limit.
      secure-cookie: false # Loopback HTTP demo only. HTTPS deployments keep true.
    security:
      require-auth: true
    cache:
      storage: sqlite
      sqlite-path: ${FOGGY_DATA_VIEWER_CACHE_SQLITE_PATH:${java.io.tmpdir}/foggy-demo-query-cache.sqlite}
      ttl-minutes: 120
    list-preset:
      storage: file
  demo-preview:
    enabled: true
    namespace: harness_demo_logistics
    model: DemoWaybillQueryModel
    internal-base-url: http://127.0.0.1:${server.port}
    public-open-url: http://127.0.0.1:${server.port}/data-viewer/open
    policy-version: demo-logistics-v1
    users:
      north:
        display-name: 北区 MCP 服务
        station-codes: [HZ-01, NB-01]
      south:
        display-name: 南区 MCP 服务
        station-codes: [SZ-01, HF-01]
      coordinator:
        display-name: 全站 MCP 服务
        station-codes: [HZ-01, SZ-01, NB-01, HF-01]
    # Map the SHA-256 fingerprint of the full MCP Authorization header to a demo service scope.
    # Use bracket map keys in external Spring configuration: [<fingerprint>]: coordinator
    credential-principals: {}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="3; url=https://foggy-projects.github.io/foggy-data-mcp-docs/">
    <title>Foggy Documentation Moved</title>
    <script>
      (function () {
        var oldBase = '/foggy-data-mcp-bridge/';
        var newBase = '/foggy-data-mcp-docs/';
        var path = window.location.pathname || '';
        var suffix = path.indexOf(oldBase) === 0 ? path.slice(oldBase.length) : '';
        var target = 'https://foggy-projects.github.io' + newBase + suffix + window.location.search + window.location.hash;

        window.__foggyDocsTarget = target;
        window.location.replace(target);
      })();
    </script>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f8fafc;
      }

      main {
        max-width: 720px;
        margin: 12vh auto;
        padding: 0 24px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 32px;
        line-height: 1.2;
      }

      p {
        font-size: 16px;
        line-height: 1.7;
      }

      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Foggy documentation moved</h1>
      <p>
        This documentation site has moved to
        <a id="target-link" href="https://foggy-projects.github.io/foggy-data-mcp-docs/">foggy-data-mcp-docs</a>.
      </p>
      <p>You will be redirected automatically.</p>
    </main>
    <script>
      (function () {
        var link = document.getElementById('target-link');
        if (link && window.__foggyDocsTarget) {
          link.href = window.__foggyDocsTarget;
          link.textContent = window.__foggyDocsTarget;
        }
      })();
    </script>
  </body>
</html>

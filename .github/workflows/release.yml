name: Release — same-tested main-authority artifacts

on:
  push:
    tags:
      - 'v9.3.4'
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to validate in dry-run mode.
        required: true
        type: string
      authority_workflow_run_id:
        description: Successful main-push 9.3.4 authority workflow run ID.
        required: true
        type: string
      authority_workflow_run_attempt:
        description: Exact successful attempt of the main authority workflow run.
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  DOCKER_IMAGE: foggysource/foggy-dataset-mcp
  RUNTIME_BASE_TAG_REFERENCE: eclipse-temurin:17-jre-alpine
  RUNTIME_BASE_PINNED_REFERENCE: eclipse-temurin:17-jre-alpine@sha256:b658bee7bbf0277559bd07dfb2e8473c30dc90c3da0d8cfe568e61f52792ce52
  RUNTIME_BASE_INDEX_DIGEST: sha256:02320dd4ce20e243dfb915c686089cf9315c763084fafbb12d5c9993aee18b57
  RUNTIME_BASE_INDEX_REFERENCE: eclipse-temurin@sha256:02320dd4ce20e243dfb915c686089cf9315c763084fafbb12d5c9993aee18b57
  RUNTIME_BASE_MANIFEST_DIGEST: sha256:b658bee7bbf0277559bd07dfb2e8473c30dc90c3da0d8cfe568e61f52792ce52
  RUNTIME_BASE_CONFIG_DIGEST: sha256:af15432fe4678068270da7f69356edd1e53555f15671a6373ce44d9e65c2dfcc
  RUNTIME_BASE_OS: linux
  RUNTIME_BASE_ARCHITECTURE: amd64
  RELEASE_ARTIFACT_TOOL: scripts/v934/step5/release_artifact_tool.py
  RELEASE_PACKAGE_TOOL: scripts/v934/step5/release_package_tool.py
  CI_TOOL: scripts/v934/step6/ci_contract_tool.py

jobs:
  release-dry-run:
    name: Same-tested JAR/archive/image dry run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.authority.outputs.version }}
      authority_run_id: ${{ steps.authority.outputs.authority_run_id }}
      authority_workflow_run_id: ${{ steps.authority.outputs.workflow_run_id }}
      authority_workflow_run_attempt: ${{ steps.authority.outputs.attempt }}
      release_artifact_name: ${{ steps.authority.outputs.artifact_name }}
      release_artifact_id: ${{ steps.authority.outputs.artifact_id }}
      release_artifact_digest: ${{ steps.authority.outputs.artifact_digest }}
      jar_sha256: ${{ steps.assets.outputs.jar_sha256 }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Verify frozen Steps 4-6 workflow/tooling bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c scripts/v934/step6/SHA256SUMS
          sha256sum -c scripts/v934/step4/SHA256SUMS
          sha256sum -c scripts/v934/step5/SHA256SUMS
          python3 "$CI_TOOL" validate-workflows --repo-root .

      - name: Resolve and verify exact main authority platform evidence
        id: authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_AUTHORITY_RUN_ID: ${{ inputs.authority_workflow_run_id }}
          REQUESTED_AUTHORITY_ATTEMPT: ${{ inputs.authority_workflow_run_attempt }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          api_root="https://api.github.com/repos/$GITHUB_REPOSITORY"
          evidence_dir="target/v934-release-dry-run"
          validation="$RUNNER_TEMP/v934-main-authority-validation.json"
          resolve_response="$RUNNER_TEMP/v934-main-authority-runs.json"
          mkdir -p "$evidence_dir"

          api_get() {
            local url="$1"
            local output="$2"
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --output "$output" "$url"
            test -s "$output"
          }

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            ref_commit="$(git rev-parse --verify "$GITHUB_REF_NAME^{commit}")"
            release_target="$(python3 "$CI_TOOL" validate-release-target \
              --event-name "$GITHUB_EVENT_NAME" \
              --github-ref "$GITHUB_REF" \
              --ref-name "$GITHUB_REF_NAME" \
              --github-sha "$GITHUB_SHA" \
              --ref-commit "$ref_commit" \
              --requested-version '')"
            api_get \
              "$api_root/actions/workflows/test-ci-evidence-chain.yml/runs?branch=main&event=push&status=success&head_sha=$GITHUB_SHA&per_page=100" \
              "$resolve_response"
            python3 "$CI_TOOL" resolve-main-authority-api \
              --repo-root . \
              --response "$resolve_response" \
              --repository "$GITHUB_REPOSITORY" \
              --commit-sha "$GITHUB_SHA" \
              > "$validation"
            main_run_id="$(jq -er '.workflow_run_id | select(type == "number")' "$validation")"
            main_attempt="$(jq -er '.attempt | select(type == "number")' "$validation")"
          else
            ref_commit="$(git rev-parse --verify 'HEAD^{commit}')"
            release_target="$(python3 "$CI_TOOL" validate-release-target \
              --event-name "$GITHUB_EVENT_NAME" \
              --github-ref "$GITHUB_REF" \
              --ref-name "$GITHUB_REF_NAME" \
              --github-sha "$GITHUB_SHA" \
              --ref-commit "$ref_commit" \
              --requested-version "$REQUESTED_VERSION")"
            [[ "$REQUESTED_AUTHORITY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$REQUESTED_AUTHORITY_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            main_run_id="$REQUESTED_AUTHORITY_RUN_ID"
            main_attempt="$REQUESTED_AUTHORITY_ATTEMPT"
          fi
          version="$(jq -er '.version | select(type == "string")' <<< "$release_target")"
          test "$version" = 9.3.4

          api_get \
            "$api_root/actions/runs/$main_run_id/attempts/$main_attempt" \
            "$evidence_dir/main-run.json"
          api_get \
            "$api_root/actions/runs/$main_run_id/attempts/$main_attempt/jobs?per_page=100" \
            "$evidence_dir/main-jobs.json"
          api_get \
            "$api_root/actions/runs/$main_run_id/artifacts?per_page=100" \
            "$evidence_dir/main-artifacts.json"
          python3 "$CI_TOOL" verify-main-authority-api \
            --repo-root . \
            --run-response "$evidence_dir/main-run.json" \
            --jobs-response "$evidence_dir/main-jobs.json" \
            --artifacts-response "$evidence_dir/main-artifacts.json" \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --workflow-run-id "$main_run_id" \
            --attempt "$main_attempt" \
            > "$validation"

          authority_run_id="$(jq -er '.authority_run_id | select(type == "string")' "$validation")"
          artifact_name="$(jq -er '.release_artifact.name | select(type == "string")' "$validation")"
          artifact_id="$(jq -er '.release_artifact.id | select(type == "number")' "$validation")"
          artifact_digest="$(jq -er '.release_artifact.digest | select(type == "string")' "$validation")"
          expected_artifact_name="v934-tested-release-assets-$GITHUB_SHA-$main_run_id-$main_attempt"
          test "$authority_run_id" = "ci-$main_run_id-$main_attempt"
          test "$artifact_name" = "$expected_artifact_name"
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "version=$version"
            echo "authority_run_id=$authority_run_id"
            echo "workflow_run_id=$main_run_id"
            echo "attempt=$main_attempt"
            echo "artifact_name=$artifact_name"
            echo "artifact_id=$artifact_id"
            echo "artifact_digest=$artifact_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact same-tested main authority release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.authority.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.authority.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.authority.outputs.artifact_digest }}
          MAIN_WORKFLOW_RUN_ID: ${{ steps.authority.outputs.workflow_run_id }}
          MAIN_WORKFLOW_ATTEMPT: ${{ steps.authority.outputs.attempt }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$ARTIFACT_NAME" = \
            "v934-tested-release-assets-$GITHUB_SHA-$MAIN_WORKFLOW_RUN_ID-$MAIN_WORKFLOW_ATTEMPT"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$GITHUB_SHA"
          test ! -e dist
          artifact_zip="$RUNNER_TEMP/v934-main-authority-artifact-$ARTIFACT_ID.zip"
          test ! -e "$artifact_zip"
          cleanup_artifact_zip() {
            rm -f -- "$artifact_zip"
          }
          trap cleanup_artifact_zip EXIT
          curl --location --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --proto '=https' --proto-redir '=https' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$artifact_zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          test "sha256:$(sha256sum "$artifact_zip" | cut -d' ' -f1)" = "$ARTIFACT_DIGEST"
          python3 "$CI_TOOL" extract-verified-artifact \
            --repo-root . \
            --archive "$artifact_zip" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --destination dist
          test -d dist
          cleanup_artifact_zip
          trap - EXIT

      - name: Verify immutable main authority release assets
        id: assets
        shell: bash
        env:
          AUTHORITY_RUN_ID: ${{ steps.authority.outputs.authority_run_id }}
          MAIN_WORKFLOW_RUN_ID: ${{ steps.authority.outputs.workflow_run_id }}
          MAIN_WORKFLOW_ATTEMPT: ${{ steps.authority.outputs.attempt }}
        run: |
          set -euo pipefail
          expected_jar_sha256="$(jq -er \
            '.files["package/app.jar"] | select(type == "string" and test("^[0-9a-f]{64}$"))' \
            dist/release-assets.json)"
          python3 "$CI_TOOL" verify-release-assets \
            --assets-dir dist \
            --authority-run-id "$AUTHORITY_RUN_ID" \
            --commit-sha "$GITHUB_SHA" \
            --workflow-run-id "$MAIN_WORKFLOW_RUN_ID" \
            --attempt "$MAIN_WORKFLOW_ATTEMPT" \
            --gate-mode authority \
            --expected-jar-sha256 "$expected_jar_sha256"
          python3 "$RELEASE_ARTIFACT_TOOL" verify-archive \
            --archive dist/v934-release-evidence.tar.gz \
            --archive-manifest dist/v934-release-evidence.archive.json
          (cd dist && sha256sum -c v934-release-evidence.tar.gz.sha256)
          test "$(jq -er '.jar.sha256' dist/v934-release-evidence.archive.json)" = "$expected_jar_sha256"
          python3 "$RELEASE_PACKAGE_TOOL" verify \
            --repo-root . \
            --manifest dist/package/package-manifest.json \
            --jar dist/package/app.jar
          test "$(sha256sum dist/package/app.jar | cut -d' ' -f1)" = "$expected_jar_sha256"
          gate_image_id="$(jq -er '.image_id' dist/package/image-manifest.json)"
          [[ "$gate_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          gate_base_tag_reference="$(jq -er '.image.base_image.tag_reference' dist/package/package-manifest.json)"
          gate_base_pinned_reference="$(jq -er '.image.base_image.pinned_reference' dist/package/package-manifest.json)"
          gate_base_index_digest="$(jq -er '.image.base_image.index_digest' dist/package/package-manifest.json)"
          gate_base_manifest_digest="$(jq -er '.image.base_image.manifest_digest' dist/package/package-manifest.json)"
          gate_base_config_digest="$(jq -er '.image.base_image.config_digest' dist/package/package-manifest.json)"
          gate_base_os="$(jq -er '.image.base_image.platform.os' dist/package/package-manifest.json)"
          gate_base_architecture="$(jq -er '.image.base_image.platform.architecture' dist/package/package-manifest.json)"
          test "$gate_base_tag_reference" = "$RUNTIME_BASE_TAG_REFERENCE"
          test "$gate_base_pinned_reference" = "$RUNTIME_BASE_PINNED_REFERENCE"
          test "$gate_base_index_digest" = "$RUNTIME_BASE_INDEX_DIGEST"
          test "$gate_base_manifest_digest" = "$RUNTIME_BASE_MANIFEST_DIGEST"
          test "$gate_base_config_digest" = "$RUNTIME_BASE_CONFIG_DIGEST"
          test "$gate_base_os" = "$RUNTIME_BASE_OS"
          test "$gate_base_architecture" = "$RUNTIME_BASE_ARCHITECTURE"
          {
            echo "jar_sha256=$expected_jar_sha256"
            echo "archive_sha256=$(sha256sum dist/v934-release-evidence.tar.gz | cut -d' ' -f1)"
            echo "archive_manifest_sha256=$(sha256sum dist/v934-release-evidence.archive.json | cut -d' ' -f1)"
            echo "archive_digest_sha256=$(sha256sum dist/v934-release-evidence.tar.gz.sha256 | cut -d' ' -f1)"
            echo "package_manifest_sha256=$(sha256sum dist/package/package-manifest.json | cut -d' ' -f1)"
            echo "image_manifest_sha256=$(sha256sum dist/package/image-manifest.json | cut -d' ' -f1)"
            echo "release_assets_sha256=$(sha256sum dist/release-assets.json | cut -d' ' -f1)"
            echo "gate_image_id=$gate_image_id"
            echo "base_tag_reference=$gate_base_tag_reference"
            echo "base_pinned_reference=$gate_base_pinned_reference"
            echo "base_index_digest=$gate_base_index_digest"
            echo "base_manifest_digest=$gate_base_manifest_digest"
            echo "base_config_digest=$gate_base_config_digest"
            echo "base_os=$gate_base_os"
            echo "base_architecture=$gate_base_architecture"
          } >> "$GITHUB_OUTPUT"

      - name: Build runtime-only image and verify embedded JAR
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          image_tag="v934-release-dry-run:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          container_id=""
          context=""
          embedded_jar="$RUNNER_TEMP/v934-release-dry-run-embedded.jar"
          cleanup() {
            local status=0
            if [[ -n "$container_id" ]]; then
              if docker rm --force "$container_id" >/dev/null 2>&1; then
                container_id=""
              else
                status=1
              fi
            fi
            if ! docker image rm --force "$image_tag" >/dev/null 2>&1; then
              status=1
            fi
            if [[ -n "$context" && -e "$context" ]]; then
              case "$context" in
                "$RUNNER_TEMP"/v934-release-context.*)
                  if ! rm -rf -- "$context" || [[ -e "$context" ]]; then
                    status=1
                  fi
                  ;;
                *) status=1 ;;
              esac
            fi
            if [[ -e "$embedded_jar" ]] && ! rm -f -- "$embedded_jar"; then
              status=1
            fi
            return "$status"
          }
          finish() {
            local original_status=$?
            trap - EXIT
            if ! cleanup; then
              exit 1
            fi
            exit "$original_status"
          }
          trap finish EXIT
          context="$(mktemp -d "$RUNNER_TEMP/v934-release-context.XXXXXX")"
          install -m 0644 foggy-mcp-launcher/Dockerfile.release "$context/Dockerfile"
          install -m 0644 dist/package/app.jar "$context/app.jar"
          mapfile -t context_entries < <(
            find "$context" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort
          )
          test "${#context_entries[@]}" -eq 2
          test "${context_entries[0]}" = Dockerfile
          test "${context_entries[1]}" = app.jar
          test "$(find "$context" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          cmp -s foggy-mcp-launcher/Dockerfile.release "$context/Dockerfile"
          cmp -s dist/package/app.jar "$context/app.jar"
          docker build \
            --pull=false \
            --file "$context/Dockerfile" \
            --build-arg TESTED_JAR=app.jar \
            --tag "$image_tag" "$context"
          base_manifest_json="$(docker buildx imagetools inspect --raw "$RUNTIME_BASE_PINNED_REFERENCE")"
          test "sha256:$(printf '%s' "$base_manifest_json" | sha256sum | cut -d' ' -f1)" = \
            "$RUNTIME_BASE_MANIFEST_DIGEST"
          test "$(jq -er '.config.digest' <<< "$base_manifest_json")" = \
            "$RUNTIME_BASE_CONFIG_DIGEST"
          base_index_json="$(docker buildx imagetools inspect --raw \
            "$RUNTIME_BASE_INDEX_REFERENCE")"
          test "sha256:$(printf '%s' "$base_index_json" | sha256sum | cut -d' ' -f1)" = \
            "$RUNTIME_BASE_INDEX_DIGEST"
          test "$(jq -er --arg manifest "$RUNTIME_BASE_MANIFEST_DIGEST" \
            --arg os "$RUNTIME_BASE_OS" --arg architecture "$RUNTIME_BASE_ARCHITECTURE" \
            '[.manifests[] | select(.digest == $manifest and .platform.os == $os and .platform.architecture == $architecture)] | length' \
            <<< "$base_index_json")" = 1
          runtime_inspect="$(docker image inspect --format '{{.Id}}|{{.Os}}|{{.Architecture}}' "$image_tag")"
          IFS='|' read -r runtime_image_id runtime_os runtime_architecture <<< "$runtime_inspect"
          [[ "$runtime_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$runtime_os" = "$RUNTIME_BASE_OS"
          test "$runtime_architecture" = "$RUNTIME_BASE_ARCHITECTURE"
          container_id="$(docker create "$image_tag")"
          docker cp "$container_id:/app/app.jar" "$embedded_jar"
          cmp -s dist/package/app.jar "$embedded_jar"
          embedded_jar_sha256="$(sha256sum "$embedded_jar" | cut -d' ' -f1)"
          test "$embedded_jar_sha256" = "${{ steps.assets.outputs.jar_sha256 }}"
          if ! cleanup; then
            trap - EXIT
            echo "runtime image/container/context cleanup failed" >&2
            exit 1
          fi
          trap - EXIT
          {
            echo "image_id=$runtime_image_id"
            echo "embedded_jar_sha256=$embedded_jar_sha256"
            echo "base_tag_reference=$RUNTIME_BASE_TAG_REFERENCE"
            echo "base_pinned_reference=$RUNTIME_BASE_PINNED_REFERENCE"
            echo "base_index_digest=$RUNTIME_BASE_INDEX_DIGEST"
            echo "base_manifest_digest=$RUNTIME_BASE_MANIFEST_DIGEST"
            echo "base_config_digest=$RUNTIME_BASE_CONFIG_DIGEST"
            echo "base_os=$runtime_os"
            echo "base_architecture=$runtime_architecture"
          } >> "$GITHUB_OUTPUT"

      - name: Record dual-identity dry-run receipt
        shell: bash
        env:
          VERSION: ${{ steps.authority.outputs.version }}
          AUTHORITY_RUN_ID: ${{ steps.authority.outputs.authority_run_id }}
          MAIN_WORKFLOW_RUN_ID: ${{ steps.authority.outputs.workflow_run_id }}
          MAIN_WORKFLOW_ATTEMPT: ${{ steps.authority.outputs.attempt }}
          ARTIFACT_ID: ${{ steps.authority.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.authority.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.authority.outputs.artifact_digest }}
          JAR_SHA256: ${{ steps.assets.outputs.jar_sha256 }}
          ARCHIVE_SHA256: ${{ steps.assets.outputs.archive_sha256 }}
          ARCHIVE_MANIFEST_SHA256: ${{ steps.assets.outputs.archive_manifest_sha256 }}
          ARCHIVE_DIGEST_SHA256: ${{ steps.assets.outputs.archive_digest_sha256 }}
          PACKAGE_MANIFEST_SHA256: ${{ steps.assets.outputs.package_manifest_sha256 }}
          IMAGE_MANIFEST_SHA256: ${{ steps.assets.outputs.image_manifest_sha256 }}
          RELEASE_ASSETS_SHA256: ${{ steps.assets.outputs.release_assets_sha256 }}
          GATE_IMAGE_ID: ${{ steps.assets.outputs.gate_image_id }}
          DRY_RUN_IMAGE_ID: ${{ steps.runtime.outputs.image_id }}
          EMBEDDED_JAR_SHA256: ${{ steps.runtime.outputs.embedded_jar_sha256 }}
          GATE_BASE_TAG_REFERENCE: ${{ steps.assets.outputs.base_tag_reference }}
          GATE_BASE_PINNED_REFERENCE: ${{ steps.assets.outputs.base_pinned_reference }}
          GATE_BASE_INDEX_DIGEST: ${{ steps.assets.outputs.base_index_digest }}
          GATE_BASE_MANIFEST_DIGEST: ${{ steps.assets.outputs.base_manifest_digest }}
          GATE_BASE_CONFIG_DIGEST: ${{ steps.assets.outputs.base_config_digest }}
          GATE_BASE_OS: ${{ steps.assets.outputs.base_os }}
          GATE_BASE_ARCHITECTURE: ${{ steps.assets.outputs.base_architecture }}
          DRY_BASE_TAG_REFERENCE: ${{ steps.runtime.outputs.base_tag_reference }}
          DRY_BASE_PINNED_REFERENCE: ${{ steps.runtime.outputs.base_pinned_reference }}
          DRY_BASE_INDEX_DIGEST: ${{ steps.runtime.outputs.base_index_digest }}
          DRY_BASE_MANIFEST_DIGEST: ${{ steps.runtime.outputs.base_manifest_digest }}
          DRY_BASE_CONFIG_DIGEST: ${{ steps.runtime.outputs.base_config_digest }}
          DRY_BASE_OS: ${{ steps.runtime.outputs.base_os }}
          DRY_BASE_ARCHITECTURE: ${{ steps.runtime.outputs.base_architecture }}
        run: |
          set -euo pipefail
          test "$GATE_BASE_TAG_REFERENCE" = "$DRY_BASE_TAG_REFERENCE"
          test "$GATE_BASE_PINNED_REFERENCE" = "$DRY_BASE_PINNED_REFERENCE"
          test "$GATE_BASE_INDEX_DIGEST" = "$DRY_BASE_INDEX_DIGEST"
          test "$GATE_BASE_MANIFEST_DIGEST" = "$DRY_BASE_MANIFEST_DIGEST"
          test "$GATE_BASE_CONFIG_DIGEST" = "$DRY_BASE_CONFIG_DIGEST"
          test "$GATE_BASE_OS" = "$DRY_BASE_OS"
          test "$GATE_BASE_ARCHITECTURE" = "$DRY_BASE_ARCHITECTURE"
          evidence_dir="target/v934-release-dry-run"
          run_api_sha256="$(sha256sum "$evidence_dir/main-run.json" | cut -d' ' -f1)"
          jobs_api_sha256="$(sha256sum "$evidence_dir/main-jobs.json" | cut -d' ' -f1)"
          artifacts_api_sha256="$(sha256sum "$evidence_dir/main-artifacts.json" | cut -d' ' -f1)"
          jq -n \
            --arg version "$VERSION" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg release_event_name "$GITHUB_EVENT_NAME" \
            --argjson release_run_id "$GITHUB_RUN_ID" \
            --argjson release_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg authority_run_id "$AUTHORITY_RUN_ID" \
            --argjson main_run_id "$MAIN_WORKFLOW_RUN_ID" \
            --argjson main_attempt "$MAIN_WORKFLOW_ATTEMPT" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --arg run_api_sha256 "$run_api_sha256" \
            --arg jobs_api_sha256 "$jobs_api_sha256" \
            --arg artifacts_api_sha256 "$artifacts_api_sha256" \
            --arg jar_sha256 "$JAR_SHA256" \
            --arg archive_sha256 "$ARCHIVE_SHA256" \
            --arg archive_manifest_sha256 "$ARCHIVE_MANIFEST_SHA256" \
            --arg archive_digest_sha256 "$ARCHIVE_DIGEST_SHA256" \
            --arg package_manifest_sha256 "$PACKAGE_MANIFEST_SHA256" \
            --arg image_manifest_sha256 "$IMAGE_MANIFEST_SHA256" \
            --arg release_assets_sha256 "$RELEASE_ASSETS_SHA256" \
            --arg gate_image_id "$GATE_IMAGE_ID" \
            --arg dry_run_image_id "$DRY_RUN_IMAGE_ID" \
            --arg embedded_jar_sha256 "$EMBEDDED_JAR_SHA256" \
            --arg gate_base_tag_reference "$GATE_BASE_TAG_REFERENCE" \
            --arg gate_base_pinned_reference "$GATE_BASE_PINNED_REFERENCE" \
            --arg gate_base_index_digest "$GATE_BASE_INDEX_DIGEST" \
            --arg gate_base_manifest_digest "$GATE_BASE_MANIFEST_DIGEST" \
            --arg gate_base_config_digest "$GATE_BASE_CONFIG_DIGEST" \
            --arg gate_base_os "$GATE_BASE_OS" \
            --arg gate_base_architecture "$GATE_BASE_ARCHITECTURE" \
            --arg dry_base_tag_reference "$DRY_BASE_TAG_REFERENCE" \
            --arg dry_base_pinned_reference "$DRY_BASE_PINNED_REFERENCE" \
            --arg dry_base_index_digest "$DRY_BASE_INDEX_DIGEST" \
            --arg dry_base_manifest_digest "$DRY_BASE_MANIFEST_DIGEST" \
            --arg dry_base_config_digest "$DRY_BASE_CONFIG_DIGEST" \
            --arg dry_base_os "$DRY_BASE_OS" \
            --arg dry_base_architecture "$DRY_BASE_ARCHITECTURE" \
            '{schema_version: 3, kind: "v934-release-dry-run", status: "passed",
              version: $version, commit_sha: $commit_sha, gate_mode: "authority",
              release_workflow: {run_id: $release_run_id, attempt: $release_attempt,
                event_name: $release_event_name},
              consumed_main_authority: {workflow_run_id: $main_run_id,
                attempt: $main_attempt, authority_run_id: $authority_run_id,
                artifact_id: $artifact_id, artifact_name: $artifact_name,
                artifact_digest: $artifact_digest, run_api_sha256: $run_api_sha256,
                jobs_api_sha256: $jobs_api_sha256,
                artifacts_api_sha256: $artifacts_api_sha256},
              tested_assets: {jar_sha256: $jar_sha256,
                archive_sha256: $archive_sha256,
                archive_manifest_sha256: $archive_manifest_sha256,
                archive_digest_sha256: $archive_digest_sha256,
                package_manifest_sha256: $package_manifest_sha256,
                image_manifest_sha256: $image_manifest_sha256,
                release_assets_sha256: $release_assets_sha256,
                gate_image_id: $gate_image_id,
                gate_base_image: {tag_reference: $gate_base_tag_reference,
                  pinned_reference: $gate_base_pinned_reference,
                  index_digest: $gate_base_index_digest,
                  manifest_digest: $gate_base_manifest_digest,
                  config_digest: $gate_base_config_digest,
                  platform: {os: $gate_base_os,
                    architecture: $gate_base_architecture}}},
              dry_run_image: {image_id: $dry_run_image_id,
                embedded_jar_sha256: $embedded_jar_sha256,
                context_files: ["Dockerfile", "app.jar"],
                base_image: {tag_reference: $dry_base_tag_reference,
                  pinned_reference: $dry_base_pinned_reference,
                  index_digest: $dry_base_index_digest,
                  manifest_digest: $dry_base_manifest_digest,
                  config_digest: $dry_base_config_digest,
                  platform: {os: $dry_base_os,
                    architecture: $dry_base_architecture}},
                status: "passed"},
              publish_performed: false}' \
            > "$evidence_dir/receipt.json"
          mapfile -t evidence_entries < <(
            find "$evidence_dir" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort
          )
          test "${#evidence_entries[@]}" -eq 4
          test "${evidence_entries[0]}" = main-artifacts.json
          test "${evidence_entries[1]}" = main-jobs.json
          test "${evidence_entries[2]}" = main-run.json
          test "${evidence_entries[3]}" = receipt.json
          test "$(find "$evidence_dir" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Upload dry-run receipt and raw main API evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v934-release-dry-run-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/v934-release-dry-run/
          if-no-files-found: error
          retention-days: 21

  docker-publish:
    name: Publish verified runtime-only image
    if: github.event_name == 'push' && github.ref == 'refs/tags/v9.3.4'
    needs: release-dry-run
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: DOCKERHUB
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify frozen Steps 4-6 workflow/tooling bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c scripts/v934/step6/SHA256SUMS
          sha256sum -c scripts/v934/step4/SHA256SUMS
          sha256sum -c scripts/v934/step5/SHA256SUMS
          python3 "$CI_TOOL" validate-workflows --repo-root .

      - name: Download the same main authority release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.release-dry-run.outputs.release_artifact_id }}
          ARTIFACT_NAME: ${{ needs.release-dry-run.outputs.release_artifact_name }}
          ARTIFACT_DIGEST: ${{ needs.release-dry-run.outputs.release_artifact_digest }}
          MAIN_WORKFLOW_RUN_ID: ${{ needs.release-dry-run.outputs.authority_workflow_run_id }}
          MAIN_WORKFLOW_ATTEMPT: ${{ needs.release-dry-run.outputs.authority_workflow_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$ARTIFACT_NAME" = \
            "v934-tested-release-assets-$GITHUB_SHA-$MAIN_WORKFLOW_RUN_ID-$MAIN_WORKFLOW_ATTEMPT"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$GITHUB_SHA"
          test ! -e dist
          artifact_zip="$RUNNER_TEMP/v934-main-authority-artifact-$ARTIFACT_ID.zip"
          test ! -e "$artifact_zip"
          cleanup_artifact_zip() {
            rm -f -- "$artifact_zip"
          }
          trap cleanup_artifact_zip EXIT
          curl --location --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --proto '=https' --proto-redir '=https' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$artifact_zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          test "sha256:$(sha256sum "$artifact_zip" | cut -d' ' -f1)" = "$ARTIFACT_DIGEST"
          python3 "$CI_TOOL" extract-verified-artifact \
            --repo-root . \
            --archive "$artifact_zip" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --destination dist
          test -d dist
          cleanup_artifact_zip
          trap - EXIT

      - name: Reverify assets and embedded JAR before login or push
        id: image
        shell: bash
        env:
          EXPECTED_JAR_SHA256: ${{ needs.release-dry-run.outputs.jar_sha256 }}
          AUTHORITY_RUN_ID: ${{ needs.release-dry-run.outputs.authority_run_id }}
          MAIN_WORKFLOW_RUN_ID: ${{ needs.release-dry-run.outputs.authority_workflow_run_id }}
          MAIN_WORKFLOW_ATTEMPT: ${{ needs.release-dry-run.outputs.authority_workflow_run_attempt }}
          VERSION: ${{ needs.release-dry-run.outputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/tags/v9.3.4
          test "$VERSION" = 9.3.4
          python3 "$CI_TOOL" verify-release-assets \
            --assets-dir dist \
            --authority-run-id "$AUTHORITY_RUN_ID" \
            --commit-sha "$GITHUB_SHA" \
            --workflow-run-id "$MAIN_WORKFLOW_RUN_ID" \
            --attempt "$MAIN_WORKFLOW_ATTEMPT" \
            --gate-mode authority \
            --expected-jar-sha256 "$EXPECTED_JAR_SHA256"
          python3 "$RELEASE_ARTIFACT_TOOL" verify-archive \
            --archive dist/v934-release-evidence.tar.gz \
            --archive-manifest dist/v934-release-evidence.archive.json
          (cd dist && sha256sum -c v934-release-evidence.tar.gz.sha256)
          test "$(jq -er '.jar.sha256' dist/v934-release-evidence.archive.json)" = "$EXPECTED_JAR_SHA256"
          python3 "$RELEASE_PACKAGE_TOOL" verify \
            --repo-root . \
            --manifest dist/package/package-manifest.json \
            --jar dist/package/app.jar
          test "$(jq -er '.image.base_image.tag_reference' dist/package/package-manifest.json)" = \
            "$RUNTIME_BASE_TAG_REFERENCE"
          test "$(jq -er '.image.base_image.pinned_reference' dist/package/package-manifest.json)" = \
            "$RUNTIME_BASE_PINNED_REFERENCE"
          test "$(jq -er '.image.base_image.index_digest' dist/package/package-manifest.json)" = \
            "$RUNTIME_BASE_INDEX_DIGEST"
          test "$(jq -er '.image.base_image.manifest_digest' dist/package/package-manifest.json)" = \
            "$RUNTIME_BASE_MANIFEST_DIGEST"
          test "$(jq -er '.image.base_image.config_digest' dist/package/package-manifest.json)" = \
            "$RUNTIME_BASE_CONFIG_DIGEST"
          test "$(jq -er '.image.base_image.platform.os' dist/package/package-manifest.json)" = \
            "$RUNTIME_BASE_OS"
          test "$(jq -er '.image.base_image.platform.architecture' dist/package/package-manifest.json)" = \
            "$RUNTIME_BASE_ARCHITECTURE"
          image_tag="$DOCKER_IMAGE:$VERSION"
          container_id=""
          context=""
          embedded_jar="$RUNNER_TEMP/v934-release-publish-embedded.jar"
          cleanup_verification() {
            local status=0
            if [[ -n "$container_id" ]]; then
              if docker rm --force "$container_id" >/dev/null 2>&1; then
                container_id=""
              else
                status=1
              fi
            fi
            if [[ -n "$context" && -e "$context" ]]; then
              case "$context" in
                "$RUNNER_TEMP"/v934-release-context.*)
                  if ! rm -rf -- "$context" || [[ -e "$context" ]]; then
                    status=1
                  fi
                  ;;
                *) status=1 ;;
              esac
            fi
            if [[ -e "$embedded_jar" ]] && ! rm -f -- "$embedded_jar"; then
              status=1
            fi
            return "$status"
          }
          finish() {
            local original_status=$?
            trap - EXIT
            if ! cleanup_verification; then
              exit 1
            fi
            exit "$original_status"
          }
          trap finish EXIT
          context="$(mktemp -d "$RUNNER_TEMP/v934-release-context.XXXXXX")"
          install -m 0644 foggy-mcp-launcher/Dockerfile.release "$context/Dockerfile"
          install -m 0644 dist/package/app.jar "$context/app.jar"
          mapfile -t context_entries < <(
            find "$context" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort
          )
          test "${#context_entries[@]}" -eq 2
          test "${context_entries[0]}" = Dockerfile
          test "${context_entries[1]}" = app.jar
          test "$(find "$context" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          cmp -s foggy-mcp-launcher/Dockerfile.release "$context/Dockerfile"
          cmp -s dist/package/app.jar "$context/app.jar"
          docker build \
            --pull=false \
            --file "$context/Dockerfile" \
            --build-arg TESTED_JAR=app.jar \
            --tag "$image_tag" "$context"
          base_manifest_json="$(docker buildx imagetools inspect --raw "$RUNTIME_BASE_PINNED_REFERENCE")"
          test "sha256:$(printf '%s' "$base_manifest_json" | sha256sum | cut -d' ' -f1)" = \
            "$RUNTIME_BASE_MANIFEST_DIGEST"
          test "$(jq -er '.config.digest' <<< "$base_manifest_json")" = \
            "$RUNTIME_BASE_CONFIG_DIGEST"
          base_index_json="$(docker buildx imagetools inspect --raw \
            "$RUNTIME_BASE_INDEX_REFERENCE")"
          test "sha256:$(printf '%s' "$base_index_json" | sha256sum | cut -d' ' -f1)" = \
            "$RUNTIME_BASE_INDEX_DIGEST"
          test "$(jq -er --arg manifest "$RUNTIME_BASE_MANIFEST_DIGEST" \
            --arg os "$RUNTIME_BASE_OS" --arg architecture "$RUNTIME_BASE_ARCHITECTURE" \
            '[.manifests[] | select(.digest == $manifest and .platform.os == $os and .platform.architecture == $architecture)] | length' \
            <<< "$base_index_json")" = 1
          runtime_inspect="$(docker image inspect --format '{{.Id}}|{{.Os}}|{{.Architecture}}' "$image_tag")"
          IFS='|' read -r runtime_image_id runtime_os runtime_architecture <<< "$runtime_inspect"
          [[ "$runtime_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$runtime_os" = "$RUNTIME_BASE_OS"
          test "$runtime_architecture" = "$RUNTIME_BASE_ARCHITECTURE"
          container_id="$(docker create "$image_tag")"
          docker cp "$container_id:/app/app.jar" "$embedded_jar"
          cmp -s dist/package/app.jar "$embedded_jar"
          test "$(sha256sum "$embedded_jar" | cut -d' ' -f1)" = "$EXPECTED_JAR_SHA256"
          if ! cleanup_verification; then
            trap - EXIT
            echo "image readback container/context cleanup failed" >&2
            exit 1
          fi
          trap - EXIT
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the already verified image
        shell: bash
        run: docker push "${{ steps.image.outputs.image_tag }}"

  github-release:
    name: Publish same-tested GitHub release assets
    if: github.event_name == 'push' && github.ref == 'refs/tags/v9.3.4'
    needs:
      - release-dry-run
      - docker-publish
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify frozen Steps 4-6 workflow/tooling bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c scripts/v934/step6/SHA256SUMS
          sha256sum -c scripts/v934/step4/SHA256SUMS
          sha256sum -c scripts/v934/step5/SHA256SUMS
          python3 "$CI_TOOL" validate-workflows --repo-root .

      - name: Download the same main authority release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.release-dry-run.outputs.release_artifact_id }}
          ARTIFACT_NAME: ${{ needs.release-dry-run.outputs.release_artifact_name }}
          ARTIFACT_DIGEST: ${{ needs.release-dry-run.outputs.release_artifact_digest }}
          MAIN_WORKFLOW_RUN_ID: ${{ needs.release-dry-run.outputs.authority_workflow_run_id }}
          MAIN_WORKFLOW_ATTEMPT: ${{ needs.release-dry-run.outputs.authority_workflow_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$ARTIFACT_NAME" = \
            "v934-tested-release-assets-$GITHUB_SHA-$MAIN_WORKFLOW_RUN_ID-$MAIN_WORKFLOW_ATTEMPT"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$GITHUB_SHA"
          test ! -e dist
          artifact_zip="$RUNNER_TEMP/v934-main-authority-artifact-$ARTIFACT_ID.zip"
          test ! -e "$artifact_zip"
          cleanup_artifact_zip() {
            rm -f -- "$artifact_zip"
          }
          trap cleanup_artifact_zip EXIT
          curl --location --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --proto '=https' --proto-redir '=https' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$artifact_zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          test "sha256:$(sha256sum "$artifact_zip" | cut -d' ' -f1)" = "$ARTIFACT_DIGEST"
          python3 "$CI_TOOL" extract-verified-artifact \
            --repo-root . \
            --archive "$artifact_zip" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --destination dist
          test -d dist
          cleanup_artifact_zip
          trap - EXIT

      - name: Reverify release files immediately before publication
        shell: bash
        env:
          EXPECTED_JAR_SHA256: ${{ needs.release-dry-run.outputs.jar_sha256 }}
          AUTHORITY_RUN_ID: ${{ needs.release-dry-run.outputs.authority_run_id }}
          MAIN_WORKFLOW_RUN_ID: ${{ needs.release-dry-run.outputs.authority_workflow_run_id }}
          MAIN_WORKFLOW_ATTEMPT: ${{ needs.release-dry-run.outputs.authority_workflow_run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/tags/v9.3.4
          python3 "$CI_TOOL" verify-release-assets \
            --assets-dir dist \
            --authority-run-id "$AUTHORITY_RUN_ID" \
            --commit-sha "$GITHUB_SHA" \
            --workflow-run-id "$MAIN_WORKFLOW_RUN_ID" \
            --attempt "$MAIN_WORKFLOW_ATTEMPT" \
            --gate-mode authority \
            --expected-jar-sha256 "$EXPECTED_JAR_SHA256"
          python3 "$RELEASE_ARTIFACT_TOOL" verify-archive \
            --archive dist/v934-release-evidence.tar.gz \
            --archive-manifest dist/v934-release-evidence.archive.json
          (cd dist && sha256sum -c v934-release-evidence.tar.gz.sha256)
          test "$(jq -er '.jar.sha256' dist/v934-release-evidence.archive.json)" = "$EXPECTED_JAR_SHA256"
          python3 "$RELEASE_PACKAGE_TOOL" verify \
            --repo-root . \
            --manifest dist/package/package-manifest.json \
            --jar dist/package/app.jar
          test "$(jq -er '.image.base_image.tag_reference' dist/package/package-manifest.json)" = \
            "$RUNTIME_BASE_TAG_REFERENCE"
          test "$(jq -er '.image.base_image.pinned_reference' dist/package/package-manifest.json)" = \
            "$RUNTIME_BASE_PINNED_REFERENCE"
          test "$(jq -er '.image.base_image.index_digest' dist/package/package-manifest.json)" = \
            "$RUNTIME_BASE_INDEX_DIGEST"
          test "$(jq -er '.image.base_image.manifest_digest' dist/package/package-manifest.json)" = \
            "$RUNTIME_BASE_MANIFEST_DIGEST"
          test "$(jq -er '.image.base_image.config_digest' dist/package/package-manifest.json)" = \
            "$RUNTIME_BASE_CONFIG_DIGEST"
          test "$(jq -er '.image.base_image.platform.os' dist/package/package-manifest.json)" = \
            "$RUNTIME_BASE_OS"
          test "$(jq -er '.image.base_image.platform.architecture' dist/package/package-manifest.json)" = \
            "$RUNTIME_BASE_ARCHITECTURE"

      - name: Publish tested JAR, archive and digests
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v9.3.4
          name: Foggy MCP v9.3.4
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/package/app.jar
            dist/v934-release-evidence.tar.gz
            dist/v934-release-evidence.tar.gz.sha256
            dist/v934-release-evidence.archive.json
            dist/package/package-manifest.json
            dist/package/image-manifest.json
            dist/package/maven-invocations.log
            dist/package/docker-build.log
            dist/package/tested-tree-validation.log
            dist/release-assets.json

name: Release — Docker Hub + GitHub Releases

on:
  push:
    tags:
      - 'v*'          # e.g. v8.1.7, v8.2.0-beta
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 8.1.7)'
        required: true

permissions:
  contents: write      # GitHub Releases upload
  packages: write      # Docker push (if using ghcr.io in future)

env:
  DOCKER_IMAGE: foggysource/foggy-dataset-mcp
  JAVA_VERSION: '17'

jobs:
  # ─────────────────────────────────────────────
  # Build JAR (shared artifact for both jobs)
  # ─────────────────────────────────────────────
  build-jar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      jar_name: ${{ steps.find-jar.outputs.jar_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Strip 'v' prefix from tag
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build JAR
        run: mvn clean package -B -pl foggy-mcp-launcher -am -DskipTests

      - name: Find JAR file
        id: find-jar
        run: |
          JAR=$(ls foggy-mcp-launcher/target/foggy-mcp-launcher-*.jar | head -1)
          JAR_NAME=$(basename "$JAR")
          echo "jar_name=$JAR_NAME" >> "$GITHUB_OUTPUT"
          echo "Found JAR: $JAR_NAME"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: foggy-mcp-jar
          path: foggy-mcp-launcher/target/foggy-mcp-launcher-*.jar
          retention-days: 1

  # ─────────────────────────────────────────────
  # Publish Docker image to Docker Hub
  # ─────────────────────────────────────────────
  docker-publish:
    runs-on: ubuntu-latest
    needs: build-jar
    environment: DOCKERHUB
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Docker tags
        id: tags
        run: |
          VERSION="${{ needs.build-jar.outputs.version }}"
          TAGS="${{ env.DOCKER_IMAGE }}:${VERSION}"
          TAGS="${TAGS},${{ env.DOCKER_IMAGE }}:latest"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Docker tags: $TAGS"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: foggy-mcp-launcher/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Publish JAR to GitHub Releases
  # ─────────────────────────────────────────────
  github-release:
    runs-on: ubuntu-latest
    needs: build-jar
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: foggy-mcp-jar
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Foggy MCP v${{ needs.build-jar.outputs.version }}"
          draft: false
          prerelease: ${{ contains(needs.build-jar.outputs.version, 'beta') || contains(needs.build-jar.outputs.version, 'alpha') }}
          generate_release_notes: true
          files: |
            dist/foggy-mcp-launcher-*.jar
          body: |
            ## Foggy MCP Server v${{ needs.build-jar.outputs.version }}

            ### Quick Start

            **Docker (recommended):**
            ```bash
            docker pull ${{ env.DOCKER_IMAGE }}:${{ needs.build-jar.outputs.version }}
            ```

            **Manual JAR (requires Java 17+):**
            ```bash
            java -jar ${{ needs.build-jar.outputs.jar_name }} --spring.profiles.active=lite
            ```

            ### Odoo Integration
            Install the `foggy_mcp` module from Odoo Apps, then use the built-in **Setup Wizard** (Settings → Foggy MCP → Launch Setup Wizard).

name: Legacy Pivot Diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  sqlite-pivot-diagnostic:
    name: Legacy SQLite pivot parity diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: SQLite profile - PivotSqlParityIT
        run: |
          report=foggy-dataset-model/target/failsafe-reports/TEST-com.foggyframework.dataset.db.model.engine.pivot.PivotSqlParityIT.xml
          rm -f "$report"
          mvn verify -pl foggy-dataset-model -am \
            -Dit.test=PivotSqlParityIT \
            -Dspring.profiles.active=sqlite \
            -DskipUnitTests=true \
            -DskipITs=false \
            -Dfailsafe.failIfNoSpecifiedTests=false \
            -P!multi-db
          test -s "$report"
          grep -q '<testcase' "$report"

  external-db-diagnostic:
    name: Legacy MySQL8/PostgreSQL pivot parity diagnostic
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Start MySQL8 and PostgreSQL services
        run: |
          docker compose -f foggy-dataset-demo/docker/docker-compose.yml up -d mysql8 postgres

      - name: MySQL8/PostgreSQL profiles - PivotSqlParityIT
        run: |
          chmod +x scripts/verify-pivot-v9-release.sh
          bash scripts/verify-pivot-v9-release.sh --skip-full-regression --skip-mcp

      - name: Stop external DB services
        if: always()
        run: |
          docker compose -f foggy-dataset-demo/docker/docker-compose.yml down -v

  v38-engine-evidence-gate:
    name: v3.8 engine environment-gated evidence
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Docker preflight
        run: |
          docker version
          docker compose version
          docker info
          df -h

      - name: PostgreSQL and SQL Server v3.8 evidence
        run: |
          mkdir -p build/v38-engine-evidence
          {
            echo "# v3.8 Engine Environment-gated Evidence"
            echo
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- run_attempt: $GITHUB_RUN_ATTEMPT"
            echo "- workflow: $GITHUB_WORKFLOW"
            echo "- ref: $GITHUB_REF"
            echo "- sha: $GITHUB_SHA"
            echo "- generated_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } > build/v38-engine-evidence/summary.md
          set -o pipefail
          bash scripts/verify-v38-engine-evidence.sh --down-after 2>&1 | tee build/v38-engine-evidence/verify-v38-engine-evidence.log

      - name: Upload v3.8 engine evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v38-engine-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/v38-engine-evidence/
          if-no-files-found: warn

  v39-engine-production-gate-candidate:
    name: v3.9 engine production-gate candidate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Docker preflight
        run: |
          docker version
          docker compose version
          docker info
          df -h

      - name: SQLite/MySQL8/PostgreSQL/SQL Server v3.9 production-gate candidate
        run: |
          mkdir -p build/v39-engine-production-gate
          {
            echo "# v3.9 Engine Production-gate Candidate"
            echo
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- run_attempt: $GITHUB_RUN_ATTEMPT"
            echo "- workflow: $GITHUB_WORKFLOW"
            echo "- ref: $GITHUB_REF"
            echo "- sha: $GITHUB_SHA"
            echo "- generated_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "This manual candidate upgrades v3.8's SQL Server weekday-only evidence toward a Maven-profile gate."
            echo
          } > build/v39-engine-production-gate/summary.md
          set -o pipefail
          bash scripts/verify-v39-engine-production-gate.sh --down-after 2>&1 | tee build/v39-engine-production-gate/verify-v39-engine-production-gate.log

      - name: Upload v3.9 engine production-gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v39-engine-production-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/v39-engine-production-gate/
          if-no-files-found: warn

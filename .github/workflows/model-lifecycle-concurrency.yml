name: Model Lifecycle Entry Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-lifecycle-entry-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  gate-0:
    name: 9.3.3 Gate 0 — runner, concurrency and required DB proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run the fail-closed 9.3.3 entry gate
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=30s 50m \
            scripts/verify-v933-entry-gate.sh

      - name: Upload Gate 0 reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-lifecycle-entry-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/v933-entry-gate/runs/
          if-no-files-found: error
          retention-days: 14

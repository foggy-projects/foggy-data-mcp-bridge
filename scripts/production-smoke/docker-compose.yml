name: foggy-production-smoke

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:18090:8080"
    volumes:
      - ./keycloak/foggy-smoke-realm.json:/opt/keycloak/data/import/foggy-smoke-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/foggy-smoke/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: foggy_smoke
      POSTGRES_USER: foggy
      POSTGRES_PASSWORD: foggy-smoke-password
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foggy -d foggy_smoke"]
      interval: 5s
      timeout: 5s
      retries: 20